name: jubicare_mmu
description: JubiCare MMU mobile prototype — Counselor, Doctor, Pharmacist workflow with modernized UI, simulated voice capture and AI clinical decision support.
publish_to: 'none'
version: 0.24.0+51

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  image_picker: ^1.2.2
  # Pure-Dart image manipulation — used to bake a Place/GPS/Date-Time
  # watermark strip onto attendance selfies + patient attachments
  # before they upload (user rule 2026-08-16).
  image: ^4.5.4
  path_provider: ^2.1.5
  speech_to_text: ^7.4.0
  # ─── Deepgram Nova-3 live STT (Patient Remarks pilot, 2026-08-19) ───
  # record: raw PCM16 mic stream @16k.  web_socket_channel: streaming
  # WebSocket to wss://api.deepgram.com/v1/listen (model=nova-3,
  # language=multi → Hindi+English code-switching). Google SpeechRecognizer
  # stays on every other mic field.
  record: ^6.1.1
  web_socket_channel: ^3.0.1
  # On-device hi→en translation of Patient Remarks at submit (2026-08-19:
  # "remarks not translated to english in db"). Models (~30 MB) download
  # once in background; translation then works offline.
  google_mlkit_translation: ^0.11.0
  # SweetAlert2-style modal alerts (user 2026-08-20: "use swalfire /
  # sweetalert2 in flutter"). Battle-tested Flutter port of SweetAlert2 —
  # coloured hero icon, animations, OK / Cancel buttons.
  quickalert: ^1.1.0
  # Split-header info/success/error dialogs with a big coloured hero
  # (yellow header + bulb icon + blue Okay pill) — user 2026-08-20
  # picked this style over the SweetAlert2 look.
  panara_dialogs: ^0.1.5
  pdf: ^3.12.0
  printing: ^5.14.3
  # ─── MMU location tracking ───
  # geolocator: GPS sampling on Android/iOS.
  # connectivity_plus: fires when internet returns so we can drain the offline
  #   buffer without polling.
  # shared_preferences: local buffer for offline GPS points.
  # firebase_core + cloud_firestore: bridge that pushes points to the
  #   JubiCare Dashboard's Firestore collection.
  geolocator: ^12.0.0
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  # HTTP client for the JubiCare backend API (revamp-back.indevconsultancy.in).
  # See docs/api_requirements.md + backend team's v2 API doc.
  http: ^1.2.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  firebase_messaging: ^15.2.10
dev_dependencies:
  flutter_lints: ^3.0.0
  # Generates the Android launcher icon from a single source PNG. Run after
  # every icon change:  flutter pub run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  # 2026-08-05: the raw jubicare_logo.png is 240x118 — squishing it into a
  # square launcher icon (and then Android's adaptive mask) produced a
  # cropped / tiny result. launcher_icon.png + launcher_icon_fg.png are
  # generated 1024x1024 versions with the logo centered inside the safe
  # zone (~66% of the canvas) so nothing gets clipped by the mask.
  image_path: "assets/launcher_icon.png"
  # White fill behind the transparent logo so the icon isn't rendered on a
  # dark launcher background where the JubiCare mark would be invisible.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher_icon_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
